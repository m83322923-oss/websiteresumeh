<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Tracking</title>
  <link rel="stylesheet" href="styleface.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="top">
        <div>
          <p class="eyebrow">AI CAMERA</p>
          <h1>Face Tracking</h1>
          <p class="sub">دوربین را روشن کن و صورت‌ها را در لحظه دنبال کن.</p>
        </div>
        <span id="status" class="status">در حال آماده‌سازی...</span>
      </div>

      <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="message" class="message">برای شروع روی «فعال کردن دوربین» بزن.</div>
      </div>

      <div class="controls">
        <button id="startBtn">فعال کردن دوربین</button>
        <button id="stopBtn" class="secondary" disabled>خاموش کردن</button>
      </div>

      <div class="stats">
        <div><span>تعداد چهره</span><strong id="count">0</strong></div>
        <div><span>وضعیت</span><strong id="trackingState">آماده</strong></div>
      </div>

      <p class="note">
        پردازش تصویر در مرورگر انجام می‌شود و تصویر دوربین به سرور ارسال نمی‌شود.
      </p>
    </section>
  </main>

  <script type="module">
    import {
  FaceDetector,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

const status = document.getElementById("status");
const message = document.getElementById("message");

const count = document.getElementById("count");
const trackingState = document.getElementById("trackingState");

let stream = null;
let detector = null;
let animationId = null;
let cameraRunning = false;


// ------------------------------
// Start Camera
// ------------------------------
async function startCamera() {

  if (cameraRunning) return;

  // Check browser support
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = "خطا";
    message.textContent =
      "مرورگر شما اجازه دسترسی به دوربین را نمی‌دهد.";
    return;
  }

  // Camera requires HTTPS
  if (!window.isSecureContext) {
    status.textContent = "خطا";
    message.textContent =
      "این سایت باید با HTTPS اجرا شود تا دوربین فعال شود.";
    return;
  }

  try {

    status.textContent = "در حال فعال کردن دوربین...";
    trackingState.textContent = "در حال اتصال";

    // IMPORTANT:
    // Camera starts BEFORE loading the AI model
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    cameraRunning = true;

    startBtn.disabled = true;
    stopBtn.disabled = false;

    status.textContent = "دوربین فعال است";
    message.textContent = "دوربین فعال شد.";

    // Set canvas size
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    /*
      Now load MediaPipe.
      Even if MediaPipe fails, the camera stays active.
    */

    status.textContent = "در حال بارگذاری Face Tracking...";

    try {

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

      detector = await FaceDetector.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
            delegate: "GPU"
          },

          runningMode: "VIDEO",

          minDetectionConfidence: 0.5
        }
      );

      status.textContent = "Face Tracking فعال است";
      trackingState.textContent = "در حال ردیابی";
      message.textContent = "";

      track();

    } catch (modelError) {

      console.error("MediaPipe error:", modelError);

      status.textContent = "دوربین فعال است";
      trackingState.textContent = "مدل AI بارگذاری نشد";

      message.textContent =
        "دوربین فعال است، اما مدل Face Tracking بارگذاری نشد.";

    }

  } catch (error) {

    console.error("Camera error:", error);

    cameraRunning = false;

    startBtn.disabled = false;
    stopBtn.disabled = true;

    status.textContent = "خطا";

    if (error.name === "NotAllowedError") {

      message.textContent =
        "دسترسی دوربین رد شده است. از تنظیمات مرورگر اجازه Camera را فعال کن.";

    } else if (error.name === "NotFoundError") {

      message.textContent =
        "هیچ دوربینی پیدا نشد.";

    } else if (error.name === "NotReadableError") {

      message.textContent =
        "دوربین توسط برنامه دیگری در حال استفاده است.";

    } else {

      message.textContent =
        "خطا در فعال کردن دوربین: " + error.message;
    }

    trackingState.textContent = "خطا";
  }
}


// ------------------------------
// Face Tracking
// ------------------------------
function track() {

  if (!cameraRunning || !detector) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const now = performance.now();

  try {

    const result = detector.detectForVideo(
      video,
      now
    );

    const faces = result.detections || [];

    count.textContent = faces.length;

    for (const face of faces) {

      const box = face.boundingBox;

      const x = box.originX;
      const y = box.originY;

      const width = box.width;
      const height = box.height;

      ctx.strokeStyle = "#00ff88";
      ctx.lineWidth = 4;

      ctx.strokeRect(
        x,
        y,
        width,
        height
      );
    }

  } catch (error) {

    console.error("Tracking error:", error);
  }

  animationId = requestAnimationFrame(track);
}


// ------------------------------
// Stop Camera
// ------------------------------
function stopCamera() {

  cameraRunning = false;

  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (stream) {

    stream.getTracks().forEach(track => {
      track.stop();
    });

    stream = null;
  }

  video.srcObject = null;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  count.textContent = "0";

  status.textContent = "خاموش";
  trackingState.textContent = "آماده";
  message.textContent =
    "برای شروع روی «فعال کردن دوربین» بزن.";

  startBtn.disabled = false;
  stopBtn.disabled = true;
}


// ------------------------------
// Buttons
// ------------------------------
startBtn.addEventListener(
  "click",
  startCamera
);

stopBtn.addEventListener(
  "click",
  stopCamera
);


// ------------------------------
// Initial state
// ------------------------------
status.textContent = "آماده";
trackingState.textContent = "آماده";
  </script>
</body>
</html>
