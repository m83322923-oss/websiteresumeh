<html>
  <head>
    <link rel="stylesheet" href="weather.css" />
  </head>
  <body>
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Segoe UI", Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #38bdf8 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #6366f1 0%, transparent 35%),
        linear-gradient(135deg, #020617, #0f172a);

    color: white;

    transition: 0.8s ease;

    overflow-x: hidden;
}


/* نورهای پس‌زمینه */

body::before {
    content: "";
    position: fixed;

    width: 350px;
    height: 350px;

    background: rgba(56, 189, 248, 0.18);

    border-radius: 50%;

    filter: blur(90px);

    top: -100px;
    left: -100px;

    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;

    width: 350px;
    height: 350px;

    background: rgba(139, 92, 246, 0.18);

    border-radius: 50%;

    filter: blur(100px);

    bottom: -120px;
    right: -100px;

    pointer-events: none;
}


/* کانتینر اصلی */

.conatainer {
    width: 92%;
    max-width: 500px;

    padding: 35px 30px;

    border-radius: 35px;

    background: rgba(255, 255, 255, 0.10);

    border: 1px solid rgba(255, 255, 255, 0.18);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);

    text-align: center;

    animation: appear 0.8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* سرچ */

#puti {
    width: 70%;

    padding: 16px 20px;

    border: none;
    outline: none;

    border-radius: 18px;

    background: rgba(255, 255, 255, 0.95);

    color: #111827;

    font-size: 16px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.2);

    transition: 0.3s ease;
}

#puti::placeholder {
    color: #64748b;
}

#puti:focus {
    width: 75%;

    transform: translateY(-2px);

    box-shadow:
        0 0 0 4px rgba(56, 189, 248, 0.25),
        0 15px 35px rgba(0, 0, 0, 0.25);
}


/* دکمه */

#butt {
    padding: 15px 35px;

    border: none;
    border-radius: 18px;

    background: linear-gradient(
        135deg,
        #38bdf8,
        #6366f1
    );

    color: white;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(59, 130, 246, 0.35);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
}

#butt:hover {
    transform: translateY(-4px) scale(1.03);

    box-shadow:
        0 15px 35px rgba(59, 130, 246, 0.55);

    filter: brightness(1.1);
}

#butt:active {
    transform: translateY(1px) scale(0.98);
}


/* دمای هوا */

#temp {
    margin-top: 25px;

    min-height: 90px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 65px;
    font-weight: 800;

    letter-spacing: -3px;

    text-shadow:
        0 5px 25px rgba(0, 0, 0, 0.25);
}

#temp p {
    font-size: 17px;

    letter-spacing: normal;

    opacity: 0.7;
}

#temp::after {
    content: "°C";

    font-size: 28px;

    margin-left: 6px;

    opacity: 0.7;

    align-self: flex-start;

    margin-top: 20px;
}


/* وضعیت هوا */

#weather_conditions {
    margin-top: 5px;

    padding: 10px 18px;

    display: inline-block;

    border-radius: 50px;

    background: rgba(255, 255, 255, 0.12);

    border: 1px solid rgba(255, 255, 255, 0.15);

    font-size: 18px;

    text-transform: capitalize;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.12);
}


/* آیکون */

#icons {
    margin-top: 20px;

    font-size: 85px;

    min-height: 100px;

    display: flex;
    justify-content: center;
    align-items: center;

    filter:
        drop-shadow(0 10px 15px rgba(0, 0, 0, 0.25));

    animation: weatherIcon 3s ease-in-out infinite;
}

@keyframes weatherIcon {0%,
    100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-10px) rotate(3deg);
    }
}


/* رطوبت */

#humidity {
    margin-top: 25px;

    padding: 18px;

    border-radius: 22px;

    background: rgba(255, 255, 255, 0.10);

    border: 1px solid rgba(255, 255, 255, 0.12);

    box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.1);
}

#humidity p {
    font-size: 14px;

    opacity: 0.65;

    margin-bottom: 5px;
}


/* پیش‌بینی */

#threeday {
    margin-top: 25px;

    padding: 20px;

    border-radius: 25px;

    background: rgba(255, 255, 255, 0.08);

    border: 1px solid rgba(255, 255, 255, 0.12);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.15);

    font-size: 18px;
}

#threeday p {
    margin-bottom: 15px;

    font-size: 16px;

    font-weight: 600;

    opacity: 0.9;
}


/* Loader */

#loader {
    display: none;

    width: 42px;
    height: 42px;

    margin: 20px auto;

    border-radius: 50%;

    border: 4px solid rgba(255, 255, 255, 0.15);

    border-top-color: white;

    animation: loading 0.8s linear infinite;
}

@keyframes loading {
    to {
        transform: rotate(360deg);
    }
}


/* آب‌وهواهای مختلف */

body.Clear {
    background:
        radial-gradient(
            circle at 50% 10%,
            #facc15,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #f97316,
            #facc15,
            #38bdf8
        );
}

body.Clouds {
    background:
        radial-gradient(
            circle at 30% 20%,
            #94a3b8,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #334155,
            #64748b,
            #0f172a
        );
}

body.Rain {
    background:
        radial-gradient(
            circle at 30% 20%,
            #38bdf8,
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #0f172a,
            #164e63,
            #1e293b
        );
}

body.Drizzle {
    background:
        linear-gradient(
            135deg,
            #1e3a8a,
            #2563eb,
            #0f172a
        );
}

body.Snow {
    background:
        radial-gradient(
            circle at 50% 20%,
            white,
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #bae6fd,
            #64748b,
            #1e3a8a
        );
}

body.Thunderstorm {
    background:
        radial-gradient(
            circle at 70% 20%,
            #a855f7,
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #020617,
            #312e81,
            #111827
        );
}

body.Mist,
body.Fog,
body.Haze {
    background:
        linear-gradient(
            135deg,
            #475569,
            #94a3b8,
            #1e293b
        );
}


/* موبایل */

@media (max-width: 600px) {

    .conatainer {
        width: 94%;

        padding: 28px 20px;

        border-radius: 28px;
    }

    #puti {
        width: 100%;

        margin-bottom: 15px;
    }

    #puti:focus {
        width: 100%;
    }

    #butt {
        width: 100%;
    }

    #temp {
        font-size: 58px;
    }

    #icons {
        font-size: 75px;
    }
}


/* اسکرول بار */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #020617;
}

::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.3);

    border-radius: 20px;
}

</html>
